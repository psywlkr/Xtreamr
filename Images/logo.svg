<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="80" fill="#000000"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="196" height="76" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Text XTREAMR -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="url(#goldGradient)" text-anchor="middle">XTREAMR</text>

  <!-- Subtitle -->
  <text x="100" y="68" font-family="Arial, sans-serif" font-size="10"
        fill="#D4AF37" text-anchor="middle">IPTV PLAYER</text>
</svg>
